# Servidor B (media): LiveKit + Coturn + Caddy (HTTPS para la señalización de LiveKit).
# Todo en red de host: el vídeo necesita UDP directo, sin proxies de por medio.
services:
  caddy:
    image: caddy:2.10.2
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  livekit:
    image: livekit/livekit-server:v1.10.1
    network_mode: host
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  coturn:
    image: coturn/coturn:4.17.2
    network_mode: host
    restart: unless-stopped
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET}
      - --realm=${TURN_DOMAIN}
      - --server-name=${TURN_DOMAIN}
      - --external-ip=${PUBLIC_IP}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  caddy-data:
